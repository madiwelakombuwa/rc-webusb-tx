<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,maximum-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>RC Control (Web Serial)</title>
<style>
:root { color-scheme: dark; }
* { box-sizing: border-box; }
body {
  background: #191919; color: #FAFAF7;
  font-family: -apple-system, system-ui, sans-serif;
  margin: 0; padding: 12px;
  user-select: none; -webkit-user-select: none;
  -webkit-touch-callout: none; overflow: hidden;
  height: 100vh;
}
h2 { color: #CC785C; text-align: center; margin: 8px 0 8px 0; letter-spacing: 2px; font-size: 20px; }
.sub { text-align: center; color: #91918D; font-size: 11px; margin-bottom: 12px; letter-spacing: 1px; }
.row { display: flex; justify-content: space-around; align-items: center; padding: 8px 0; }
.stick {
  width: 160px; height: 160px; border-radius: 50%;
  background: #262625; border: 2px solid #40403E;
  position: relative; touch-action: none;
}
.stick-label {
  text-align: center; color: #91918D; font-size: 11px;
  margin-bottom: 6px; letter-spacing: 1.5px;
}
.puck {
  width: 64px; height: 64px; border-radius: 50%; background: #CC785C;
  position: absolute; left: 48px; top: 48px;
  box-shadow: 0 0 24px rgba(204,120,92,0.45);
  transition: left 0.10s ease-out, top 0.10s ease-out;
}
.puck.active { transition: none; }
.btn-row {
  display: grid; grid-template-columns: 1fr 1fr 1fr 1fr;
  gap: 6px; padding: 10px 0;
}
button {
  background: #262625; color: #CC785C; border: 1px solid #CC785C;
  padding: 10px 4px; border-radius: 8px; font-size: 12px; letter-spacing: 1px;
  touch-action: manipulation; font-family: inherit;
}
button:active { background: #CC785C; color: #191919; }
button:disabled { opacity: 0.35; border-color: #40403E; color: #91918D; }
.connect {
  width: 100%; padding: 16px; font-size: 16px; letter-spacing: 2px;
  background: #CC785C; color: #191919; border: none; border-radius: 10px;
  margin: 8px 0;
}
.connect.connected { background: #262625; color: #91918D; border: 1px solid #91918D; }
.status {
  text-align: left; padding: 8px; color: #91918D; font-size: 11px;
  font-family: Menlo, monospace; line-height: 1.4;
  max-height: 30vh; overflow-y: auto;
}
.status .v { color: #FAFAF7; }
.status .ok { color: #6FB07F; }
.status .err { color: #BF4D43; }
</style>
</head>
<body>
<h2>RC CONTROL · Web Serial</h2>
<div class="sub">Phone ⟶ USB-OTG ⟶ ESP32-C3 ⟶ PPM</div>

<button id="connect" class="connect">CONNECT C3 SERIAL</button>
<button id="probe" style="width:100%; background:#262625; color:#91918D; border:1px solid #40403E; padding:8px; border-radius:8px; font-size:11px; letter-spacing:1px; margin-bottom:4px;">DEBUG: WHAT DOES CHROME SEE?</button>
<button id="probeUsb" style="width:100%; background:#262625; color:#91918D; border:1px solid #40403E; padding:8px; border-radius:8px; font-size:11px; letter-spacing:1px; margin-bottom:8px;">DEBUG: TRY WEBUSB PICKER</button>

<div class="row">
  <div>
    <div class="stick-label">THROTTLE</div>
    <div id="tStick" class="stick"><div class="puck"></div></div>
  </div>
  <div>
    <div class="stick-label">STEERING</div>
    <div id="sStick" class="stick"><div class="puck"></div></div>
  </div>
</div>

<div class="btn-row">
  <button class="led" data-cmd="h" disabled>LED ON</button>
  <button class="led" data-cmd="l" disabled>LED OFF</button>
  <button class="led" data-cmd="t" disabled>TOGGLE</button>
  <button class="led" data-cmd="b" disabled>BLINK</button>
</div>

<div class="status">
  <div>t=<span class="v" id="dt">90</span>
       &nbsp;s=<span class="v" id="ds">90</span>
       &nbsp;pkt/s=<span class="v" id="rate">0</span></div>
  <div id="state">tap "CONNECT C3 SERIAL" above</div>
</div>

<script>
// ─── Web Serial connection ────────────────────────────────────────────────
// Web Serial works on Chrome desktop and on Chrome Android (148+, April 2026).
// Unlike WebUSB, it can claim USB-CDC serial ports (no protected-class block).
// NOTE: do NOT use filters on Android -- the picker is stricter there and may
// hide otherwise-valid devices. Show ALL serial ports; user picks manually.

let port = null;
let writer = null;
let pktCount = 0, pktCountLastSec = 0;

const $ = (id) => document.getElementById(id);
const setStatus = (text, cls = '') => {
  const el = $('state');
  el.textContent = text;
  el.className = cls;
};

async function connect() {
  if (!('serial' in navigator)) {
    setStatus('Web Serial not supported in this browser. Use Chrome on Android (v148+) or Chrome desktop.', 'err');
    return;
  }
  try {
    // No filters -- show every serial port Chrome can see.
    // On Android Chrome the picker is sometimes empty if filters are too tight.
    port = await navigator.serial.requestPort();
    await port.open({ baudRate: 115200 });
    writer = port.writable.getWriter();

    // Drain reads in the background so the C3 doesn't fill its TX buffer
    (async () => {
      const reader = port.readable.getReader();
      try { while (true) { const { done } = await reader.read(); if (done) break; } }
      catch (e) {}
      finally { reader.releaseLock(); }
    })();

    setStatus('Connected · 115200 baud', 'ok');
    $('connect').textContent = 'CONNECTED · TAP TO DISCONNECT';
    $('connect').classList.add('connected');
    document.querySelectorAll('button.led').forEach(b => b.disabled = false);

    setInterval(() => {
      $('rate').textContent = pktCount - pktCountLastSec;
      pktCountLastSec = pktCount;
    }, 1000);
  } catch (e) {
    setStatus('Connect failed: ' + e.message, 'err');
    port = null;
  }
}

async function disconnect() {
  try {
    if (writer) { writer.releaseLock(); writer = null; }
    if (port)   { await port.close(); port = null; }
  } catch (e) { /* ignore */ }
  setStatus('Disconnected', '');
  $('connect').textContent = 'CONNECT C3 SERIAL';
  $('connect').classList.remove('connected');
  document.querySelectorAll('button.led').forEach(b => b.disabled = true);
}

$('connect').addEventListener('click', () => {
  if (port) disconnect(); else connect();
});

// ─── Debug probe: list permission-granted serial ports + capabilities ─────
$('probe').addEventListener('click', async () => {
  const lines = [];
  lines.push('userAgent: ' + navigator.userAgent.slice(0, 60));
  lines.push('serial in nav: ' + ('serial' in navigator));
  lines.push('usb    in nav: ' + ('usb' in navigator));
  if ('serial' in navigator) {
    try {
      const ports = await navigator.serial.getPorts();
      lines.push('pre-granted ports: ' + ports.length);
      ports.forEach((p, i) => {
        try {
          const info = p.getInfo();
          lines.push('  [' + i + '] VID=0x' + info.usbVendorId?.toString(16) +
                          ' PID=0x' + info.usbProductId?.toString(16));
        } catch (e) { lines.push('  [' + i + '] (getInfo err: ' + e.message + ')'); }
      });
    } catch (e) { lines.push('getPorts err: ' + e.message); }
  }
  if ('usb' in navigator) {
    try {
      const devs = await navigator.usb.getDevices();
      lines.push('pre-granted USB devs: ' + devs.length);
      devs.forEach((d, i) => {
        lines.push('  [' + i + '] VID=0x' + d.vendorId?.toString(16) +
                        ' PID=0x' + d.productId?.toString(16) +
                        ' "' + (d.productName || '') + '"');
      });
    } catch (e) { lines.push('usb getDevices err: ' + e.message); }
  }
  setStatus(lines.join('\\n'));
  // Also render multi-line in the status box
  $('state').innerHTML = lines.join('<br>');
});

// WebUSB picker probe -- different code path than Web Serial; tells us
// whether Android's USB stack sees the C3 at all.
$('probeUsb').addEventListener('click', async () => {
  if (!('usb' in navigator)) {
    $('state').textContent = 'navigator.usb missing'; return;
  }
  try {
    // No filter -- show every USB device the OS will offer.
    const d = await navigator.usb.requestDevice({ filters: [{}] });
    const info = ['picked USB device:',
      '  VID=0x' + d.vendorId.toString(16) + ' PID=0x' + d.productId.toString(16),
      '  product: ' + (d.productName || '(none)'),
      '  manufacturer: ' + (d.manufacturerName || '(none)'),
      '  serial: ' + (d.serialNumber || '(none)')];
    $('state').innerHTML = info.join('<br>');
  } catch (e) {
    $('state').innerHTML = 'WebUSB picker err: ' + e.message +
      '<br><br>If "No device selected": the picker was empty (OS doesn\'t see the C3).' +
      '<br>If you saw devices listed: tell me what they were.';
  }
});

// ─── Send helpers ─────────────────────────────────────────────────────────
const encoder = new TextEncoder();
async function sendLine(line) {
  if (!writer) return;
  try {
    await writer.write(encoder.encode(line + '\n'));
    pktCount++;
  } catch (e) {
    setStatus('TX err: ' + e.message, 'err');
  }
}

// ─── Joysticks ────────────────────────────────────────────────────────────
let throttleY = 0, steeringX = 0;
function setupStick(id, mode) {
  const j = $(id);
  const puck = j.querySelector('.puck');
  const max = 48;
  let active = false;

  const fromTouch = (e) => {
    const r = j.getBoundingClientRect();
    const t = e.touches ? e.touches[0] : e;
    return [t.clientX - r.left - r.width/2, t.clientY - r.top - r.height/2];
  };
  function move(x, y) {
    const m = Math.hypot(x, y);
    if (m > max) { x *= max/m; y *= max/m; }
    puck.style.left = (48 + x) + 'px';
    puck.style.top  = (48 + y) + 'px';
    if (mode === 'y') throttleY = -y / max;  // stick up = positive
    else              steeringX =  x / max;
  }
  function reset() {
    puck.classList.remove('active');
    puck.style.left = '48px'; puck.style.top = '48px';
    if (mode === 'y') throttleY = 0; else steeringX = 0;
  }
  const begin = (e) => { active = true; puck.classList.add('active'); const [x,y] = fromTouch(e); move(x,y); e.preventDefault && e.preventDefault(); };
  const drag  = (e) => { if (!active) return; const [x,y] = fromTouch(e); move(x,y); e.preventDefault && e.preventDefault(); };
  const end   = () => { active = false; reset(); };

  j.addEventListener('touchstart', begin, { passive: false });
  j.addEventListener('touchmove',  drag,  { passive: false });
  j.addEventListener('touchend',   end,   { passive: false });
  j.addEventListener('mousedown',  begin);
  j.addEventListener('mousemove',  drag);
  j.addEventListener('mouseup',    end);
  j.addEventListener('mouseleave', end);
}
setupStick('tStick', 'y');
setupStick('sStick', 'x');

// ─── Control loop ─────────────────────────────────────────────────────────
let lastSent = { t: -1, s: -1 };
let lastSendMs = 0;
setInterval(() => {
  const t = Math.round(90 + throttleY * 90);
  const s = Math.round(90 + steeringX * 90);
  $('dt').textContent = t;
  $('ds').textContent = s;
  if (!writer) return;
  const now = performance.now();
  const changed = (t !== lastSent.t) || (s !== lastSent.s);
  if ((changed && now - lastSendMs > 20) || now - lastSendMs > 200) {
    sendLine(`${t} ${s}`);
    lastSent = { t, s };
    lastSendMs = now;
  }
}, 20);

// ─── LED buttons ──────────────────────────────────────────────────────────
document.querySelectorAll('button.led').forEach(b => {
  b.addEventListener('click', () => sendLine(b.dataset.cmd));
});
</script>
</body>
</html>
